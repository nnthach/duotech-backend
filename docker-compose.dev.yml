services:
  db:
    image: postgres:16-alpine
    container_name: user-authenticate-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-networks
  api: # container app (hot reload)
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: node-api-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
    ports:
      - '${PORT}:${PORT}'
    volumes:
      - .:/src
      - /src/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-networks

volumes:
  postgres_data_dev:

networks:
  app-networks:
    driver: bridge
